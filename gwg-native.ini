[Game]
; The game is resolved relative to this file, so a relative path is fine - the
; launcher normalises it, which matters because a ".." in the path makes the
; game fail its own data-file lookup and crash.
Exe=..\game.exe

; How long to wait after resuming the game before injecting. The game builds its
; window and its Direct3D device within a few hundred milliseconds, and the
; presentation proxy only sees the call if it is installed first.
InjectDelayMs=100

[Shim]
Dll=bin\gwgshim32.dll

[Logging]
File=gwg-native.log

[IoBoard]
; How long CTS stays low after a reset command. The game polls about once a
; second, so this has to be long enough for it to observe.
BusyMs=2500

; How many 0xF1 handshake rounds to answer, which is how many channels the
; emulated board reports. 2 is correct.
Rounds=2

; Override the canned reply packet, e.g. E0000B0101010101010101010115.
Reply=

; Echo everything the game writes straight back, for comparing framings.
Echo=0

[Hooks]
; Comma-separated list of API names to leave unhooked. Empty installs all.
; Diagnostic aid for isolating a hook that misbehaves.
Skip=

[Patches]
; In-memory fixes applied to game.exe at attach time. Format:
;   ADDRESS=OLD>NEW     (hex; NEW alone to write without checking OLD)
; Addresses are virtual addresses at the default image base (0x00400000).
;
; The game's hardware self-test stores "coinerror" / "i/oerror" into its error
; field when an I/O board check fails. Both stores sit behind a short conditional
; jump; turning it into an unconditional jump takes the same "hardware is fine"
; path the game takes when the check passes. See src\shim\patches.cpp.
;
; 0x43E426  74 17  je ->  EB 17  jmp    do not store "coinerror"
; 0x43E469  74 17  je ->  EB 17  jmp    do not store "i/oerror"
SkipBoardErrors = 0043E426=74>EB;0043E469=74>EB

[Diagnostics]
; Set to 1 to sample the game's main-thread instruction pointer. This is what
; located the CTS wait at 0x51F845; the spinning code calls nothing we hook.
TracePC = 0

; Set to 1 to wrap the game's device in counting stubs and log which vtable
; slots it actually calls, busiest first. Present is the one called about once
; per frame. Diagnostic only - the game plays normally either way.
DeviceProbe = 1

[Presentation]
; The game asks for exclusive fullscreen, which would drag the whole desktop
; down to its own 640x480 mode. Windowed keeps the display resolution untouched.
Windowed = 1

; Strip the title bar and frame, and centre the window on the desktop.
Borderless = 1

; Hide the cursor while the game has focus.
HideCursor = 1

; Turn the picture upright and show it in a borderless window covering the
; desktop. The game draws its portrait art rotated into the 640x480 back
; buffer, so this captures the game window and turns it the other way. Needs no
; extra Direct3D work, and is independent of Windowed/Borderless above.
Rotate = 1

; Capture rate. The game presents far faster than the display refreshes, so
; this caps how often the picture is copied and scaled.
RotateFps = 60

; Which way to turn it: 0 = counter-clockwise (the game draws it turned the
; other way, so this is what makes it read upright), 1 = clockwise.
RotateDir = 0

; Smooth scaling. Off keeps hard pixels, which suits pixel art and leaves the
; CRT shader stack something cleaner to work with.
RotateSmooth = 0

; Pixels of the game window left uncovered along the bottom. The game window is
; parked against the bottom of the screen and the presentation window stops short
; by this much. It cannot be zero: once a Direct3D window is completely covered
; the driver stops presenting into it and a blit of it comes back blank. A few
; pixels of the sideways picture show in this strip.
RotateSliver = 2
